<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Delivery Hub Dashboard – SpiceRoute</title>
    <meta name="description" content="Dedicated portal for SpiceRoute delivery drivers to manage doorstep delivery fulfillment.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚴</text></svg>">
    <style>
        .delivery-card {
            background: #fff;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            overflow: hidden;
            transition: var(--transition);
        }
        .delivery-card:hover {
            box-shadow: 0 8px 22px rgba(0,0,0,0.08);
        }
        .delivery-card-head {
            padding: 14px 18px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .delivery-card-body {
            padding: 20px 18px;
        }
        .delivery-card-foot {
            padding: 14px 18px;
            background: #fdfdfd;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn-deliver-now {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-deliver-now:hover {
            background: #059669;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .address-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin: 12px 0;
        }
    </style>
</head>
<body style="background:#f1f5f9;">

    <!-- Top Navigation -->
    <header class="navbar" style="background:#fff; border-bottom:1px solid #e2e8f0;">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon" style="background:var(--success);">🚴</div>
                <span>Spice<span>Route</span> <small style="font-size:0.75rem; color:var(--success); font-weight:700; text-transform:uppercase; margin-left:4px;">Delivery Hub</small></span>
            </a>

            <div class="nav-actions">
                <a href="../orders.html" class="btn btn-outline btn-sm">Customer View</a>
                <span id="driverBadge" style="font-size:0.88rem; font-weight:700; color:#166534; background:#dcfce7; padding:4px 10px; border-radius:20px;">
                    🚴 Suresh Patil
                </span>
                <button onclick="App.handleLogout()" class="btn btn-outline btn-sm">Log Out</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container" style="max-width:760px; padding-top:24px; padding-bottom:60px;">
        
        <!-- Status Header Banner -->
        <div style="background:#fff; border-radius:var(--radius-lg); padding:20px; border:1px solid var(--border-color); margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div>
                <h1 style="font-size:1.4rem; color:var(--secondary); margin-bottom:4px;">Doorstep Deliveries</h1>
                <p style="font-size:0.85rem; color:var(--text-muted); margin:0;">Deliver prepared orders to customers & collect cash</p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <div style="text-align:right;">
                    <span style="font-size:0.75rem; text-transform:uppercase; color:var(--text-light); font-weight:700;">Status</span>
                    <div style="font-size:0.9rem; font-weight:700; color:var(--success);">● On Duty Active</div>
                </div>
                <button onclick="loadDriverOrders()" class="btn btn-outline btn-sm" style="margin-left:8px;">
                    🔄 Refresh
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="chip-btn active" id="tabActiveBtn" onclick="setViewMode('Active', this)">
                📦 Active Shipments (<span id="activeCountBadge">0</span>)
            </button>
            <button class="chip-btn" id="tabDeliveredBtn" onclick="setViewMode('Delivered', this)">
                ✓ Completed Deliveries (<span id="completedCountBadge">0</span>)
            </button>
        </div>

        <!-- Orders Cards Container -->
        <div id="driverOrdersContainer">
            <!-- Populated dynamically via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyDeliveryState" style="display:none; text-align:center; padding:50px 20px; background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border-color);">
            <div style="font-size:3.5rem; margin-bottom:10px;">🛵</div>
            <h3 style="font-size:1.25rem; color:var(--secondary); margin-bottom:4px;">No Assigned Tasks</h3>
            <p style="color:var(--text-muted); font-size:0.9rem; margin:0;">All current food orders have been fulfilled.</p>
        </div>

    </main>

    <!-- Scripts -->
    <script src="../js/store.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let currentUser = null;
        let allAssignedOrders = [];
        let viewMode = 'Active';

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = Store.getCurrentUser();
            if (!currentUser || currentUser.role !== 'delivery') {
                window.location.replace('login.html');
                return;
            }

            document.getElementById('driverBadge').textContent = `🚴 ${currentUser.name}`;

            await loadDriverOrders();

            // Auto-refresh every 8 seconds
            setInterval(loadDriverOrders, 8000);
        });

        async function loadDriverOrders() {
            try {
                // Fetch orders assigned to this delivery courier (or out for delivery)
                const orders = await Store.getOrders();
                
                // Show orders assigned to this courier or currently out for delivery
                allAssignedOrders = orders.filter(o => 
                    (o.delivery_boy_id === currentUser.user_id) || 
                    (o.status === 'Out for Delivery')
                );

                updateBadges();
                renderCards();
            } catch (err) {
                console.error('Failed to load driver orders:', err);
            }
        }

        function updateBadges() {
            const activeCount = allAssignedOrders.filter(o => o.status !== 'Delivered' && o.status !== 'Cancelled').length;
            const completedCount = allAssignedOrders.filter(o => o.status === 'Delivered').length;

            document.getElementById('activeCountBadge').textContent = activeCount;
            document.getElementById('completedCountBadge').textContent = completedCount;
        }

        window.setViewMode = function(mode, btn) {
            viewMode = mode;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderCards();
        };

        function renderCards() {
            const container = document.getElementById('driverOrdersContainer');
            const emptyState = document.getElementById('emptyDeliveryState');

            let filtered = [];
            if (viewMode === 'Active') {
                filtered = allAssignedOrders.filter(o => o.status !== 'Delivered' && o.status !== 'Cancelled');
            } else {
                filtered = allAssignedOrders.filter(o => o.status === 'Delivered');
            }

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            container.innerHTML = filtered.map(order => {
                const customerName = order.customer ? order.customer.name : 'Valued Customer';
                const customerPhone = order.customer ? order.customer.phone : 'Not provided';
                const isCod = order.payment && order.payment.mode === 'COD';

                const payBox = isCod ? `
                    <div style="background:#fee2e2; border:1px solid #fecaca; border-radius:var(--radius-sm); padding:10px 14px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:700; color:#991b1b;">💵 Cash on Delivery (COD)</span>
                        <span style="font-size:1.15rem; font-weight:800; color:#991b1b;">Collect ₹${order.total_amount}</span>
                    </div>
                ` : `
                    <div style="background:#dcfce7; border:1px solid #bbf7d0; border-radius:var(--radius-sm); padding:10px 14px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:700; color:#166534;">✓ Prepaid (${order.payment ? order.payment.mode : 'Online'})</span>
                        <span style="font-size:0.95rem; font-weight:700; color:#166534;">Do not collect cash</span>
                    </div>
                `;

                const itemsSummary = (order.items || []).map(it => 
                    `<strong>${it.quantity}x</strong> ${it.name}`
                ).join(', ');

                let actionButton = '';
                if (order.status !== 'Delivered') {
                    actionButton = `
                        <button onclick="markAsDelivered(${order.order_id})" class="btn-deliver-now">
                            ✓ Mark as Delivered
                        </button>
                    `;
                } else {
                    actionButton = `
                        <span style="color:var(--success); font-weight:700; font-size:0.92rem;">
                            ✓ Delivered on ${order.order_date || 'Today'}
                        </span>
                    `;
                }

                return `
                    <div class="delivery-card">
                        <div class="delivery-card-head">
                            <div>
                                <span style="font-size:1.1rem; font-weight:800; color:var(--secondary);">Order #${order.order_id}</span>
                                <span style="font-size:0.82rem; color:var(--text-light); margin-left:8px;">${order.order_date || 'Today'}</span>
                            </div>
                            <div>
                                <span style="font-size:0.8rem; font-weight:700; background:#e0f2fe; color:#0369a1; padding:4px 10px; border-radius:20px;">
                                    ● ${order.status}
                                </span>
                            </div>
                        </div>

                        <div class="delivery-card-body">
                            <div style="font-size:0.8rem; font-weight:700; color:var(--text-light); text-transform:uppercase;">Customer & Phone</div>
                            <div style="font-size:1.05rem; font-weight:700; color:var(--secondary); margin-bottom:4px;">
                                ${customerName} &nbsp; 
                                <a href="tel:${customerPhone}" style="color:var(--primary); font-size:0.92rem; text-decoration:underline;">📞 ${customerPhone}</a>
                            </div>

                            <div class="address-box">
                                <div style="font-size:0.75rem; font-weight:700; color:var(--text-light); text-transform:uppercase; margin-bottom:2px;">Destination Address:</div>
                                <div style="font-size:0.95rem; font-weight:600; color:var(--text-main);">
                                    📍 ${order.delivery_address || 'Address provided on checkout'} (PIN: ${order.pincode || '400001'})
                                </div>
                            </div>

                            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:8px;">
                                <strong>Food Parcel:</strong> ${itemsSummary}
                            </div>

                            ${payBox}
                        </div>

                        <div class="delivery-card-foot">
                            <div style="font-size:0.88rem; color:var(--text-muted);">
                                Total Bill: <strong>₹${order.total_amount}</strong>
                            </div>
                            <div>
                                ${actionButton}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.markAsDelivered = async function(orderId) {
            if (!confirm(`Are you sure you want to mark Order #${orderId} as Delivered to the customer?`)) {
                return;
            }

            try {
                const res = await Store.updateOrderStatus(orderId, 'Delivered', currentUser.user_id);
                if (res.success) {
                    App.showToast(`Order #${orderId} marked as Delivered! Great job!`, 'success');
                    await loadDriverOrders();
                } else {
                    App.showToast(res.message || 'Failed to update delivery status', 'error');
                }
            } catch (err) {
                App.showToast('Network error updating delivery', 'error');
            }
        };
    </script>
</body>
</html>
