<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customer Account – SpiceRoute</title>
    <meta name="description" content="Register an account with SpiceRoute to order authentic gourmet food and enjoy fast doorstep delivery.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍛</text></svg>">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">🍛</div>
                <span>Spice<span>Route</span></span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
            </ul>

            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
            </div>
        </div>
    </header>

    <!-- Register Container -->
    <section class="section" style="padding: 40px 0 80px;">
        <div class="container">
            <div class="auth-form-card" style="max-width:520px;">
                <div style="text-align:center; margin-bottom:24px;">
                    <div style="width:54px; height:54px; background:var(--primary-light); color:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 12px;">
                        📝
                    </div>
                    <h1 style="font-size:1.8rem; color:var(--secondary); margin-bottom:6px;">Create Account</h1>
                    <p style="color:var(--text-muted); font-size:0.92rem;">Join SpiceRoute to unlock express dining delivery</p>
                </div>

                <form id="registerForm">
                    <div class="form-field">
                        <label for="regName" class="field-label">Full Name *</label>
                        <input type="text" id="regName" class="input-control" required>
                    </div>

                    <div class="form-field">
                        <label for="regEmail" class="field-label">Email Address *</label>
                        <input type="email" id="regEmail" class="input-control" required autocomplete="email">
                    </div>

                    <div class="form-field">
                        <label for="regPassword" class="field-label">Choose Password (min 6 characters) *</label>
                        <input type="password" id="regPassword" class="input-control" minlength="6" required autocomplete="new-password">
                    </div>

                    <div class="form-field">
                        <label for="regPhone" class="field-label">Mobile Number (10 digits) *</label>
                        <input type="tel" id="regPhone" class="input-control" maxlength="10" required>
                    </div>

                    <div class="form-field">
                        <label for="regAddress" class="field-label">Delivery Address (Street, Building, Area) *</label>
                        <textarea id="regAddress" class="input-control" rows="2" required></textarea>
                    </div>

                    <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
                        Register Account &rarr;
                    </button>
                </form>

                <div style="text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--border-color); font-size:0.92rem; color:var(--text-muted);">
                    Already registered? 
                    <a href="login.html" style="color:var(--primary); font-weight:700;">Sign In</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-wrap">
        <div class="container">
            <div class="footer-copyright">
                <p>&copy; 2026 SpiceRoute Restaurant Private Limited. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            const nameInput = document.getElementById('regName');
            const emailInput = document.getElementById('regEmail');
            const passInput = document.getElementById('regPassword');
            const phoneInput = document.getElementById('regPhone');
            const addrInput = document.getElementById('regAddress');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const phone = phoneInput.value.trim();
                const address = addrInput.value.trim();

                if (!phone.match(/^[0-9]{10}$/)) {
                    App.showToast('Please enter a valid 10-digit mobile number.', 'error');
                    phoneInput.focus();
                    return;
                }

                if (address.length < 8) {
                    App.showToast('Please enter a complete delivery address.', 'error');
                    addrInput.focus();
                    return;
                }

                const submitBtn = document.getElementById('regSubmitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating Account...';

                const result = await Store.register({
                    name: nameInput.value.trim(),
                    email: emailInput.value.trim(),
                    password: passInput.value.trim(),
                    phone: phone,
                    address: address
                });

                submitBtn.disabled = false;
                submitBtn.textContent = 'Register Account →';

                if (result.success) {
                    App.showToast('Account created successfully! Welcome to SpiceRoute.', 'success');
                    setTimeout(() => {
                        window.location.replace('menu.html');
                    }, 400);
                } else {
                    App.showToast(result.message || 'Registration failed.', 'error');
                }
            });
        });
    </script>
</body>
</html>
