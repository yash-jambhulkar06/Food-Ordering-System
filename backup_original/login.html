<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – SpiceRoute Online Food Ordering</title>
    <meta name="description" content="Sign in to your SpiceRoute account to order dishes and track deliveries.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍛</text></svg>">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">🍛</div>
                <span>Spice<span>Route</span></span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
            </ul>

            <div class="nav-actions">
                <a href="register.html" class="btn btn-outline btn-sm">Register</a>
            </div>
        </div>
    </header>

    <!-- Sign In Container -->
    <section class="section" style="padding: 50px 0 80px;">
        <div class="container">
            <div class="auth-form-card">
                <div style="text-align:center; margin-bottom:28px;">
                    <div style="width:54px; height:54px; background:var(--primary-light); color:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 14px;">
                        🔐
                    </div>
                    <h1 style="font-size:1.8rem; color:var(--secondary); margin-bottom:6px;">Welcome Back</h1>
                    <p style="color:var(--text-muted); font-size:0.92rem;">Sign in with your registered account credentials</p>
                </div>

                <!-- Error Message Alert Container -->
                <div id="loginErrorAlert" style="display:none; background:var(--danger-light); color:#991b1b; border:1px solid #fecaca; border-radius:var(--radius-md); padding:12px 16px; margin-bottom:20px; font-size:0.92rem; align-items:center; gap:8px;">
                    <span>⚠️</span>
                    <span id="loginErrorMsg">Invalid credentials</span>
                </div>

                <form id="loginForm">
                    <div class="form-field">
                        <label for="loginEmail" class="field-label">Email Address *</label>
                        <input type="email" id="loginEmail" class="input-control" required autocomplete="username">
                    </div>

                    <div class="form-field">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <label for="loginPassword" class="field-label" style="margin:0;">Password *</label>
                        </div>
                        <input type="password" id="loginPassword" class="input-control" required autocomplete="current-password">
                    </div>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; font-size:0.88rem;">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-muted);">
                            <input type="checkbox" id="rememberMe" checked>
                            Remember me
                        </label>
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block btn-lg">
                        Sign In &rarr;
                    </button>
                </form>

                <div style="text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--border-color); font-size:0.92rem; color:var(--text-muted);">
                    Don't have an account yet? 
                    <a href="register.html" style="color:var(--primary); font-weight:700;">Create Account</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-wrap">
        <div class="container">
            <div class="footer-copyright">
                <p>&copy; 2026 SpiceRoute Restaurant Private Limited. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('loginEmail');
            const passInput = document.getElementById('loginPassword');
            const errorAlert = document.getElementById('loginErrorAlert');
            const errorMsg = document.getElementById('loginErrorMsg');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                errorAlert.style.display = 'none';

                const email = emailInput.value.trim();
                const password = passInput.value.trim();

                const result = Store.login(email, password);

                if (result.success) {
                    App.showToast(`Signed in as ${result.user.name}`, 'success');

                    // Route based on role
                    setTimeout(() => {
                        if (result.user.role === 'admin') {
                            window.location.replace('admin/index.html');
                        } else if (result.user.role === 'hotel') {
                            window.location.replace('hotel/index.html');
                        } else if (result.user.role === 'delivery') {
                            window.location.replace('delivery/index.html');
                        } else {
                            window.location.replace('menu.html');
                        }
                    }, 400);
                } else {
                    // Exact required message
                    errorMsg.textContent = 'Invalid credentials';
                    errorAlert.style.display = 'flex';
                    App.showToast('Invalid credentials', 'error');
                    passInput.value = '';
                    passInput.focus();
                }
            });
        });
    </script>
</body>
</html>
